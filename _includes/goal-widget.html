{% if site.short_term_goal %}
<aside class="goal-widget" id="goal-widget" aria-label="短期目标">
  <div class="goal-widget__bar">
    <span class="goal-widget__title">★ 短期目标</span>
    <button type="button" class="goal-widget__toggle" id="goal-widget-toggle" aria-expanded="true" aria-controls="goal-widget-body" aria-label="收起短期目标">
      <span aria-hidden="true">_</span>
    </button>
  </div>
  <div class="goal-widget__body" id="goal-widget-body">
    <p class="goal-widget__text">{{ site.short_term_goal }}</p>
    <div class="goal-widget__meter" aria-hidden="true"><span></span></div>
    <p class="goal-widget__status">IN PROGRESS<span class="goal-widget__cursor">_</span></p>
  </div>
</aside>
{% endif %}
